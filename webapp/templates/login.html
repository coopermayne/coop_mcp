{% extends "base.html" %}
{% block title %}Sign in · Journal{% endblock %}
{% block content %}

<div class="max-w-sm mx-auto text-center py-16">
  <h1 class="text-2xl font-bold tracking-tight">Journal</h1>
  <p class="text-sm text-gray-500 mt-2">A private record. Sign in to continue.</p>

  {% if error %}
  <p class="mt-6 text-sm text-black border border-black rounded-[4px] px-4 py-3">{{ error }}</p>
  {% endif %}

  <a href="{{ base }}/auth/login"
     class="inline-block mt-8 px-6 py-2.5 bg-black text-white text-sm font-medium hover:bg-gray-800 transition-colors">
    Sign in with Google
  </a>
</div>

{% endblock %}
