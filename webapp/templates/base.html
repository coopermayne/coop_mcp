<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="{{ base }}/static/favicon.svg" type="image/svg+xml" />
  <title>{% block title %}Journal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #fff; color: #000; }
    .set-pill {
      display: inline-flex; align-items: center; padding: 0.125rem 0.5rem;
      border: 1px solid #e5e7eb; font-size: 0.75rem; font-variant-numeric: tabular-nums;
      line-height: 1.625; white-space: nowrap; border-radius: 3px;
    }
    .badge {
      display: inline-flex; align-items: center; padding: 1px 0.375rem;
      border: 1px solid #e5e7eb; font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.025em; line-height: 1.625; border-radius: 2px; color: #6b7280;
    }
    .badge-dark { border-color: #000; color: #000; }
  </style>
</head>
<body class="min-h-screen bg-white text-black">
  {% if active %}
  <header class="border-b border-gray-100 sticky top-0 bg-white/90 backdrop-blur z-10">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <a href="{{ base }}/" class="hidden sm:block text-sm font-semibold tracking-tight">Journal</a>
      <nav class="flex items-center gap-4 sm:gap-5 text-xs uppercase tracking-widest text-gray-400">
        <a href="{{ base }}/journal" class="hover:text-black transition-colors {% if active == 'journal' %}text-black{% endif %}">Journal</a>
        <a href="{{ base }}/workouts" class="hover:text-black transition-colors {% if active == 'workouts' %}text-black{% endif %}">Training</a>
        <a href="{{ base }}/drinking" class="hover:text-black transition-colors {% if active == 'drinking' %}text-black{% endif %}">Drinking</a>
        <a href="{{ base }}/people" class="hover:text-black transition-colors {% if active == 'people' %}text-black{% endif %}">People</a>
        {% if auth_enabled %}<a href="{{ base }}/logout" class="hover:text-black transition-colors text-gray-300">Out</a>{% endif %}
      </nav>
    </div>
  </header>
  {% endif %}
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
